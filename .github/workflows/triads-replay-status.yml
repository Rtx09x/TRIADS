name: TRIADS replay status inspection
on:
  push:
    branches: [audit/mat2vec-sha256-20261024]
    paths: [.github/workflows/triads-replay-status.yml]
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect independent replay status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,os,json,pathlib
          req=urllib.request.Request(
             'https://api.github.com/repos/Rtx09x/TRIADS/actions/runs?branch=audit%2Fmat2vec-sha256-20261024&per_page=35',
             headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'TRIADS-replay-check'})
          with urllib.request.urlopen(req,timeout=35) as r: data=json.load(r)
          rows=[{'id':x['id'],'name':x['name'],'status':x['status'],'conclusion':x['conclusion'],'url':x['html_url']}
                for x in data['workflow_runs'] if 'replay' in x['name'].lower()]
          print(json.dumps(rows,indent=2))
          pathlib.Path('audits/prediction_replay_status.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
      - name: Save status evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audits/prediction_replay_status.json
          git commit -m "Record model replay audit status [skip ci]"
          git pull --rebase origin audit/mat2vec-sha256-20261024
          git push origin HEAD:audit/mat2vec-sha256-20261024
