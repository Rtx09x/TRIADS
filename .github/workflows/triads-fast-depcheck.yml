name: TRIADS steels fast dependency resolve
on:
  push:
    branches: [audit/mat2vec-sha256-20261024]
    paths: [.github/workflows/triads-fast-depcheck.yml]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve candidate inference dependencies and HF artifacts
        shell: bash
        run: |
          mkdir -p audits
          cat > /tmp/triads-steels.txt <<'EOF'
          torch==2.3.1
          numpy==1.26.4
          pandas==2.2.2
          scipy==1.13.1
          scikit-learn==1.5.1
          pymatgen==2024.7.18
          matminer==0.9.3
          gensim==4.3.3
          matplotlib==3.9.1
          tqdm==4.66.4
          huggingface_hub==0.24.7
          EOF
          python - <<'PY'
          import json, pathlib, subprocess, urllib.request, sys, traceback
          out = {'source':'TRIADS requirements + steels-only subset', 'python':sys.version}
          try:
              p=subprocess.run([sys.executable,'-m','pip','install','--dry-run','-r','/tmp/triads-steels.txt'], capture_output=True,text=True,timeout=350)
              out['dependency_resolution']={'success':p.returncode==0,'returncode':p.returncode,'stdout_tail':p.stdout[-2500:],'stderr_tail':p.stderr[-5000:]}
          except Exception as exc:
              out['dependency_resolution']={'error':str(exc)}
          for repo in ('Rtx09x/TRIADS','Rtx09/TRIADS'):
              try:
                  with urllib.request.urlopen('https://huggingface.co/api/models/'+repo,timeout=20) as res:
                      d=json.load(res)
                  out['hf']={'repo':repo,'files':[s.get('rfilename') for s in d.get('siblings',[]) if 'steel' in s.get('rfilename','').lower()]}
                  break
              except Exception as exc:
                  out.setdefault('hf_errors',[]).append(str(exc))
          pathlib.Path('audits/triads_fast_depcheck.json').write_text(json.dumps(out,indent=2,default=str)+'\n')
          print(json.dumps(out,indent=2,default=str))
          PY
      - name: Publish report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/triads_fast_depcheck.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record TRIADS steels pip resolution [skip ci]"
            git pull --rebase origin audit/mat2vec-sha256-20261024
            git push origin HEAD:audit/mat2vec-sha256-20261024
          fi
