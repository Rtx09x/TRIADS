name: TRIADS audit run diagnostics
on:
  push:
    branches: [audit/mat2vec-sha256-20261024]
    paths: [.github/workflows/triads-audit-run-diagnostics.yml]
permissions:
  contents: write
  actions: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record conclusions of recent audit workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,pathlib
          url='https://api.github.com/repos/Rtx09x/TRIADS/actions/runs?branch=audit%2Fmat2vec-sha256-20261024&per_page=35'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
             'Accept':'application/vnd.github+json','User-Agent':'TRIADS-audit-inspection'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          summary=[{'id':w['id'],'workflow':w['name'],'status':w['status'],
                    'conclusion':w['conclusion'],'html_url':w['html_url'],
                    'created_at':w['created_at']}
                   for w in data['workflow_runs']]
          pathlib.Path('audits/triads_workflow_status.json').write_text(
              json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Persist status report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/triads_workflow_status.json
          git commit -m "Record isolated audit workflow outcomes [skip ci]"
          git pull --rebase origin audit/mat2vec-sha256-20261024
          git push origin HEAD:audit/mat2vec-sha256-20261024
